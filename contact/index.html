<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with zsurf.tech — editorial inquiries, partnerships, corrections." />
  <link rel="canonical" href="https://zsurf.tech/contact/" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
  <title>Contact — zsurf.tech</title>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="../index.html" class="logo"><span class="logo-mark">z</span><span class="logo-text">surf<span class="dot">.tech</span></span></a>
      <nav class="nav" id="nav">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="../articles/index.html" class="nav-link">Articles</a>
        <a href="../about/index.html" class="nav-link">About</a>
        <a href="index.html" class="nav-link active">Contact</a>
        <a href="../privacy/index.html" class="nav-link">Privacy</a>
      </nav>
      <button class="nav-toggle" id="navToggle">☰</button>
    </div>
  </header>

  <main class="page">
    <h1>Contact</h1>
    <p>Editorial tips, partnership inquiries, corrections, and feedback — we read every message.</p>
    <p><strong>Email:</strong> hello@zsurf.tech</p>

    <form onsubmit="event.preventDefault(); document.getElementById('contactMsg').textContent='Thanks! We will reply within 2 business days.'; this.reset();">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit" class="btn btn-primary">Send Message</button>
      <p id="contactMsg" style="color:#16a34a;margin-top:10px;" role="status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <div class="footer-col"><h4>zsurf.tech</h4><p>Independent technology publication.</p></div>
      <div class="footer-col"><h4>Read</h4><ul><li><a href="../articles/index.html">All Articles</a></li></ul></div>
      <div class="footer-col"><h4>Company</h4><ul><li><a href="../about/index.html">About</a></li><li><a href="../privacy/index.html">Privacy</a></li></ul></div>
    </div>
    <div class="footer-bottom"><div class="container"><p>© 2026 zsurf.tech</p></div></div>
  </footer>
  <script src="../assets/js/main.js"></script>
</body>
</html>
